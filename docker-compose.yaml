# ignored options for 'myjenkins-blueocean'
# --detach
# named network 'jenkins' is marked as "external" (used by service 'myjenkins-blueocean'), so either remove "external" from network definition or it needs to be created using: docker network create -d bridge jenkins
# named volume 'jenkins-data' is marked as "external" (used by service 'myjenkins-blueocean'), so either remove "external" from volume definition or it needs to be created using: docker volume create jenkins-data
# named volume 'jenkins-docker-certs' is marked as "external" (used by service 'myjenkins-blueocean'), so either remove "external" from volume definition or it needs to be created using: docker volume create jenkins-docker-certs
name: jenkins-101
services:
    docker:
        container_name: jenkins-docker
        privileged: true
        networks:
            jenkins:
                aliases:
                    - docker
        environment:
            - DOCKER_TLS_CERTDIR=/certs
        volumes:
            - jenkins-docker-certs:/certs/client
            - jenkins-data:/var/jenkins_home
        ports:
            - 2376:2376
        image: docker:dind
        command: --storage-driver overlay2
    myjenkins-blueocean:
        container_name: jenkins-blueocean
        restart: on-failure
        networks:
            - jenkins
        environment:
            - DOCKER_HOST=tcp://docker:2376
            - DOCKER_CERT_PATH=/certs/client
            - DOCKER_TLS_VERIFY=1
        ports:
            - 18080:8080
            - 50000:50000
        volumes:
            - jenkins-data:/var/jenkins_home
            - jenkins-docker-certs:/certs/client:ro
        image: myjenkins-blueocean:2.555.1-1
networks:
    jenkins:
        external: false
        name: jenkins
volumes:
    jenkins-data:
        external: true
        name: jenkins-data
    jenkins-docker-certs:
        external: true
        name: jenkins-docker-certs